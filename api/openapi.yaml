  /api/v1/requests:
    get:
      summary: Read the recent metadata-only call index, not a tamper-proof evidence ledger
      security:
      - adminSession: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditView'
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: application_id
        in: query
        schema: *id003
  /v1/traces/{trace_id}:
    get:
      summary: Query only the authenticated application's observed task fragment
      description: Correlation is not authorization or task correctness. Reads the global most-recent
        1000-request index, returning at most 128 matching records. Missing references stay unresolved
        without consulting other applications. No visible records returns the same 404 for absent,
        evicted or inaccessible traces. No prompts, answers, credentials or external agent internals.
      security:
      - applicationKey: []
      parameters:
      - $ref: '#/components/parameters/TracePathID'
      - $ref: '#/components/parameters/TraceLimit'
      responses:
        '200':
          description: Bounded observed records, caller-declared edges and policy observations; never task success
          content:
            application/json:
              schema:
                $ref: '../schemas/traces.schema.json#/$defs/TraceView'
        '404':
          description: trace_not_found; no visible record in the selected retained window
        default:
          $ref: '#/components/responses/Error'
  /api/v1/traces/{trace_id}:
    get:
      summary: Explicitly aggregate selected applications' task fragments as an administrator
      description: Requires one to sixteen distinct application_id query parameters. There is no implicit
        all-applications view. A shared trace ID is only a caller claim and does not establish shared access,
        causality or task completion. Edges resolve solely against returned records.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/TracePathID'
      - $ref: '#/components/parameters/TraceLimit'
      - name: application_id
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items: {type: string, maxLength: 100}
      responses:
        '200':
          description: Explicitly scoped bounded aggregation; no full task or compliance determination
          content:
            application/json:
              schema:
                $ref: '../schemas/traces.schema.json#/$defs/TraceView'
        '404':
          description: trace_not_found; no visible record in the selected retained window
        default:
          $ref: '#/components/responses/Error'
  /v1/models:
    get:
      summary: List only enabled aliases allowed for the authenticated application
      security:
      - applicationKey: []
      responses:
        '200':
          description: OpenAI-compatible model list, without an upstream network call
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    const: list
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: *id003
                        object:
                          const: model
                        created:
                          const: 0
                        owned_by:
                          const: govweave
                      required:
                      - id
                      - object
                      - created
                      - owned_by
                required:
                - object
                - data
        default:
          $ref: '#/components/responses/Error'
  /api/v1/policies/credential-egress:
    get:
      summary: Read the credential egress policy
      security:
      - adminSession: []
      responses:
        '200': &id004
          description: Saved policy; fresh instances default to disabled, revision 0.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPolicy'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Atomically save the credential egress policy with revision checking
      description: Changes affect new evaluations. Already evaluated requests retain their snapshot. This
        request policy runs locally on decoded request JSON strings. Observe forwards the
        unmodified request, including matches. Block rejects before upstream I/O. Saves atomically append an immutable
        snapshot and activate it. History is limited to 1024 snapshots and 8 MiB; a full history rejects updates
        with 409 policy_history_full and keeps the current policy. No legal compliance determination. A policy result of redact recommends a transformation; this endpoint never
        executes it or returns redaction completion evidence.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialPolicyInput'
      responses:
        '200': *id004
        '409':
          description: Revision conflict or policy_history_full; the current policy remains active.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/policies/credential-egress/history:
    get:
      summary: List retained credential policy snapshots, newest first
      description: Read-only history. New instances retain revision 0; upgraded instances start at their last
        legacy revision. Earlier missing configurations are not reconstructed. The exclusive revision cursor
        keeps older pages stable when new revisions are saved.
      security:
      - adminSession: []
      parameters:
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: before_revision
        in: query
        schema:
          type: integer
          minimum: 0
        description: Return only revisions strictly below this value.
      responses:
        '200':
          description: Retained snapshots and optional cursor for the next older page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPolicyHistory'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/policies/credential-egress/revisions/{revision}:
    get:
      summary: Read the immutable credential policy configuration for a retained revision
      description: Resolve content_policy.revision from a request record. This does not change the active policy.
      security:
      - adminSession: []
      parameters:
      - name: revision
        in: path
        required: true
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: Immutable policy snapshot.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialPolicy'
        '404':
          description: Revision is not retained, including revisions before a legacy migration baseline.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/compliance/packs:
    get:
      summary: List installed declarative rule pack versions
      security:
      - adminSession: []
      responses:
        '200':
          description: Immutable startup catalog; an absent rule-packs directory yields an empty list.
          content:
            application/json:
              schema:
                $ref: '../schemas/compliance.schema.json#/$defs/Catalog'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/evaluations:
    post:
      summary: Evaluate supplied product evidence against an exact installed rule pack version
      description: Stateless, local, advisory evaluation only. Does not invoke providers, persist facts or reports,
        intercept Chat Completions, or determine legal compliance. Caller provenance is an assertion, not independently
        verified evidence. Maximum request size is 16 KiB, with 64 concurrent evaluations (429 compliance_busy
        on overload). Missing, expired, stale, future or type-incompatible
        evidence remains unknown. No fallback to another pack version.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/compliance.schema.json#/$defs/EvaluationInput'
      responses:
        '200':
          description: Per-control technical results, evidence references and exact rule pack digest.
          content:
            application/json:
              schema:
                $ref: '../schemas/compliance.schema.json#/$defs/Evaluation'
        '404':
          description: rule_pack_not_found; the requested ID and version are not installed.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/compliance/products:
    get:
      summary: List registered products and saved administrative profile facts
      security:
      - adminSession: []
      responses:
        '200':
          description: List registered products and saved administrative profile facts
          content:
            application/json:
              schema:
                $ref: ../schemas/products.schema.json#/$defs/ProductList
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Register a product with application bindings and an exact rule pack version
      description: Binds existing applications, including tool-only applications with no model grants.
        Administrative facts cannot define runtime.* or testing.*; the server supplies configuration and
        bounded audit evidence for model calls and controlled read tools. A rule pack is advisory and does
        not change runtime tool grants or output mode.
      security:
      - adminSession: []
      parameters:
      - &product_id002
        $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/products.schema.json#/$defs/ProductInput
      responses:
        '200':
          description: Saved profile; runtime evidence is collected by the server.
          content:
            application/json:
              schema:
                $ref: ../schemas/products.schema.json#/$defs/Product
        '409':
          description: revision_conflict; reload the product before updating.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/products/{id}:
    get:
      summary: Read a registered product profile
      security:
      - adminSession: []
      responses:
        '200':
          description: Read a registered product profile
          content:
            application/json:
              schema:
                $ref: ../schemas/products.schema.json#/$defs/Product
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - &product_id001
        name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$
    put:
      summary: Update a product profile with revision checking
      security:
      - adminSession: []
      parameters:
      - *product_id001
      - *product_id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/products.schema.json#/$defs/ProductInput
      responses:
        '200':
          description: Saved profile; runtime evidence is collected by the server.
          content:
            application/json:
              schema:
                $ref: ../schemas/products.schema.json#/$defs/Product
        '409':
          description: revision_conflict; reload the product before updating.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/products/{id}/evaluation:
    get:
      summary: Read the current automatic advisory assessment
      security:
      - adminSession: []
      responses:
        '200':
          description: Read the current automatic advisory assessment
          content:
            application/json:
              schema:
                $ref: ../schemas/products.schema.json#/$defs/Report
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - *product_id001
      description: Configuration changes, including the global tool-store revision, and known evidence clock boundaries invalidate
        prior successes. A pending response contains no evaluation payload and schedules
        reevaluation. Ready responses use server-collected runtime facts; profile evidence
        remains administrator-supplied. Latest reports are in memory and recomputed
        on restart. runtime.tools.* describes enabled resource grants, output-blocking coverage and
        tool counters from the latest 100 global indexed request entries filtered to bound applications
        and tools.invoke. This is not a per-product window or full history. Tool counters are omitted
        when audit is unavailable; missing evidence remains unknown. Chat Completion counters remain separate.
        Current qualifying output-control test runs also supply testing.output.pre_deployment.passed and
        testing.output.operation.passed for models, or testing.tools.output.pre_deployment.passed and
        testing.tools.output.operation.passed for read tools. Tool suites additionally require a denied-resource
        check; model and tool evidence cannot substitute for each other. Both require exact current
        plan and source versions. Each product supports one plan per target kind, including any legacy default;
        current reports combine both namespaces. Latest runs are selected independently per plan and phase.
        The latest inconclusive or running result does not reuse older success.
        snapshot.test_evidence_revision is a process-local cache generation and is not comparable across restarts.
  /api/v1/compliance/products/{id}/evaluate:
    post:
      summary: Refresh a registered product using current gateway-owned evidence
      description: Uses current model/tool configuration and metadata-only call records. Accepts no evidence
        override or caller-supplied runtime facts. This evaluates controls without invoking an upstream tool
        or model. The optional snapshot.tool_revision pins tool-store freshness; older archived stamps remain readable.
      security:
      - adminSession: []
      parameters:
      - *product_id001
      - *product_id002
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: New advisory assessment or explicit evaluation error state.
          content:
            application/json:
              schema:
                $ref: ../schemas/products.schema.json#/$defs/Report
        '429':
          description: assessment_busy; gateway or product inputs kept changing during
            snapshot evaluation.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/compliance/packs/{id}/versions/{version}:
    get:
      summary: Read the exact installed rule pack definition and source metadata
      security:
      - adminSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$
      - name: version
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$
      responses:
        '200':
          description: Independent read-only pack definition. Review metadata is an
            operator assertion.
          content:
            application/json:
              schema:
                $ref: ../schemas/compliance.schema.json#/$defs/Pack
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/products/{id}/reports:
    get:
      summary: List retained report summaries for a registered product
      security:
      - adminSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$
      responses:
        '200':
          description: Newest capture first, bounded by the global 256-report capacity.
          content:
            application/json:
              schema:
                $ref: ../schemas/reports.schema.json#/$defs/ReportList
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Capture a fresh immutable advisory report with exact product, rule pack
        and evidence snapshots
      description: Explicit capture only; periodic assessments are not automatically
        archived. Persists governance fact values for replay, never model request/response
        bodies, retrieved tool text, raw resource IDs, upstream endpoints or credentials from runtime adapters.
        Includes the tool-store revision and bounded tool evidence when available. Maximum 1 MiB per report, 256 reports and 64 MiB total;
        capacity errors retain existing reports.
      security:
      - adminSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Committed private snapshot and SHA-256 of its exact file bytes.
          content:
            application/json:
              schema:
                $ref: ../schemas/reports.schema.json#/$defs/ArchivedReport
        '409':
          description: archive_capacity or assessment_unavailable; no report replaced.
        '429':
          description: archive_busy or assessment_busy; retry later.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/reports/{report}:
    get:
      summary: Read a retained historical report independently of current product/plugin
        versions
      security:
      - adminSession: []
      parameters:
      - name: report
        in: path
        required: true
        schema:
          type: string
          pattern: ^rpt_[A-Za-z0-9_-]{22}$
      responses:
        '200':
          description: Historical snapshot, not a current compliance state. Includes
            fact values.
          content:
            application/json:
              schema:
                $ref: ../schemas/reports.schema.json#/$defs/ArchivedReport
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/reports/{report}/replay:
    post:
      summary: Replay a report at its retained evaluation time using retained rules
        and facts
      description: Does not invoke a model or tool or recollect output evidence. Replays the archived
        technical result, including the original tool sample; it does not establish the current product state.
      security:
      - adminSession: []
      parameters:
      - name: report
        in: path
        required: true
        schema:
          type: string
          pattern: ^rpt_[A-Za-z0-9_-]{22}$
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Deterministic replay with the supported evaluator version; no
            live source access.
          content:
            application/json:
              schema:
                $ref: ../schemas/reports.schema.json#/$defs/Replay
        '409':
          description: replay_version_unsupported; the historical document remains readable.
        default:
          $ref: '#/components/responses/Error'

  /api/v1/compliance/test-suites:
    get:
      summary: List installed test suite versions
      security:
      - adminSession: []
      responses:
        '200':
          description: Immutable startup catalog of bounded, declarative tests.
          content:
            application/json:
              schema:
                $ref: '../schemas/testing.schema.json#/$defs/Catalog'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/test-suites/{id}/versions/{version}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    - {name: version, in: path, required: true, schema: {type: string}}
    get:
