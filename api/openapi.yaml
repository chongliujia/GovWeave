openapi: 3.1.0
info:
  title: GovWeave model gateway, controlled read tools and administration API
  version: 0.2.0-dev
  description: Single-instance model connections, application authorization, Chat Completions, optional request
    credential checks, application-scoped read-tool execution with bounded output credential checks,
    optional sensitive-output policy and standalone content observations,
    metadata-only call records and advisory evaluations using local declarative rule packs.
    MCP and regulatory policy enforcement are not implemented.
    All management mutations require application/json and the X-GovWeave-Request header set to console; cross-site
    origins are rejected. Human-readable messages default to English. Use stable error.code values for programmatic
    handling; the console localizes known messages locally.
paths:
  /api/v1/evidence-traces/{trace_id}/snapshots:
    parameters:
    - $ref: '#/components/parameters/TracePathID'
    - $ref: '#/components/parameters/TaskSnapshotApplications'
    post:
      summary: Save the unchanged task evidence view as a metadata snapshot
      description: Administrator session and protected mutation required. Rebuilds the bounded server view
        and compares expected_view_sha256 with its current digest; a mismatch returns 409 without saving.
        Client-submitted records are never accepted. The digest from the live GET is copied verbatim.
        The default limit is 100; send the same limit as the viewed query. This is still a non-atomic
        audit/vault observation. Saves private authenticated metadata only, without body content or
        additional inference. Maximum 256 snapshots, 2 MiB per stored file, 64 MiB total, four concurrent
        create/read operations. No automatic eviction or expiry. Unknown/repeated parameters are rejected
        except distinct application_id values; total query length is capped at 2048 bytes.
        Repeated successful POSTs create distinct snapshots; inspect the list before retrying an uncertain save.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      - $ref: '#/components/parameters/TraceLimit'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/evidence.schema.json#/$defs/TaskSnapshotCreate'
      responses:
        '201':
          description: Immutable metadata snapshot; evidence states describe save time
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/ArchivedTaskEvidence'
        '409':
          description: task_view_changed; reload the live view before saving
        '429':
          description: task_snapshot_busy; concurrent snapshot operation limit reached
        '507':
          description: evidence_capacity; snapshot count, file size or total byte budget reached
        default:
          $ref: '#/components/responses/Error'
    get:
      summary: List task snapshots matching the exact trace and application set
      description: Administrator only. Returns at most 256 indexed summaries, newest first. A subset or
        superset of an archived application set does not match. No limit or other filters accepted.
        Valid scopes with no matching snapshots return an empty items array. Listing does not revalidate every file; opening/exporting
        checks local authentication. Snapshots remain separate from content retention and live audit windows.
      security:
      - adminSession: []
      responses:
        '200':
          description: Summaries with exact application-set scope
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/TaskSnapshotList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/evidence-traces/{trace_id}/snapshots/{snapshot_id}:
    get:
      summary: Read a saved task snapshot without re-reading live calls or content
      description: Administrator only. Requires the exact trace and application set retained in the snapshot.
        No limit or other filters accepted. Local authentication does not establish external attestation,
        complete history, actual data flow, task completion or legal compliance. Missing or unsafe files
        return evidence_unavailable; an unknown ID or mismatched valid scope returns evidence_not_found.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/TracePathID'
      - $ref: '#/components/parameters/TaskSnapshotApplications'
      - $ref: '#/components/parameters/TaskSnapshotPathID'
      responses:
        '200':
          description: Historical snapshot and digest of exact JSON export bytes
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/ArchivedTaskEvidence'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/evidence-traces/{trace_id}/snapshots/{snapshot_id}/export/{format}:
    get:
      summary: Download a saved task snapshot as JSON or an English Markdown report
      description: Administrator only; same exact trace/application scope and local authentication checks
        as snapshot read. No body content or live queries. JSON bytes, including their final newline,
        match summary.sha256 and summary.bytes. Markdown is a deterministic English presentation of
        the saved observations with coverage limits and finding versions; its cited digest is for the
        JSON export, not the Markdown file. No other query filters or language options are accepted.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/TracePathID'
      - $ref: '#/components/parameters/TaskSnapshotApplications'
      - $ref: '#/components/parameters/TaskSnapshotPathID'
      - name: format
        in: path
        required: true
        schema: {type: string, enum: [json, markdown]}
      responses:
        '200':
          description: Download attachment; no-store and nosniff headers apply
          headers:
            Content-Disposition:
              schema: {type: string}
            X-GovWeave-SHA256:
              description: Present for JSON only; digest of the exact downloaded bytes
              schema: {type: string, pattern: '^[0-9a-f]{64}$'}
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/TaskSnapshot'
            text/markdown:
              schema: {type: string}
        default:
          $ref: '#/components/responses/Error'
  /api/v1/evidence-traces/{trace_id}:
    get:
      summary: Inspect retained evidence and recent calls across explicitly selected applications
      description: Administrator session only. Select 1-16 existing applications; no implicit all-applications
        scope. Calls are graph nodes and parent/link/retry edges remain caller declarations, resolved only
        against returned records. The view reads the newest min(32,limit) unexpired captures across the scope,
        then fills remaining call slots from the latest 128 matching records in the global recent-1000 audit
        index. Audit and vault snapshots are not atomic and the result is not archived. Missing, unreadable,
        or budget-excluded captures have distinct states; findings come only from successfully read captures.
        No body content is returned and capture settings are unchanged. Valid empty queries return 200 with
        empty calls; this does not prove safety or absence of activity. Query strings are capped at 2048 bytes;
        only application_id may repeat, with distinct values. Application keys cannot use this endpoint.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/TracePathID'
      - $ref: '#/components/parameters/TraceLimit'
      - name: application_id
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: array
          minItems: 1
          maxItems: 16
          uniqueItems: true
          items:
            $ref: '../schemas/evidence.schema.json#/$defs/ApplicationID'
      responses:
        '200':
          description: Bounded metadata task graph with explicit scope, evidence states and coverage limits
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/EvidenceTraceView'
        '400':
          description: invalid_trace_query; missing or unknown scope, duplicate application IDs, repeated limit or malformed filter
        '503':
          description: evidence_unavailable; evidence or audit service is unavailable
        default:
          $ref: '#/components/responses/Error'
  /api/v1/evidence/config:
    get:
      summary: Read the optional evidence capture configuration
      description: Capture starts disabled. Enabled metadata/full modes require explicit existing application
        IDs; an empty list never means all applications. No query parameters are accepted. This endpoint
        returns configuration, not evidence coverage or detector effectiveness.
      security:
      - adminSession: []
      responses:
        '200':
          description: Current capture configuration
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/EvidenceConfig'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Explicitly configure application-scoped evidence retention
      description: Requires the current revision. Saves a new revision after recording configuration-change
        authorization in the separate metadata access journal. Modes are disabled, metadata and full;
        retention is 1-365 days and max_content_bytes is 4096-1048576 per object. Full mode can retain
        sensitive body content in a separately encrypted vault. Settings are frozen for each admitted
        capture; later changes do not retroactively erase or change existing captures. Ordinary call logs
        remain metadata only. Supplementary capture failure does not alter admitted inference or existing
        policy/audit gates. At most 2048 sealed bundles and 256 MiB of sealed-file bytes are retained.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/evidence.schema.json#/$defs/EvidenceConfig'
      responses:
        '200':
          description: Saved configuration with incremented revision
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/EvidenceConfig'
        '409':
          description: revision_conflict; refresh the current configuration
        '503':
          description: evidence_unavailable; configuration or access journal could not be written or verified
        '507':
          description: evidence_capacity; the bounded access journal cannot record authorization
        default:
          $ref: '#/components/responses/Error'
  /api/v1/evidence:
    get:
      summary: List retained evidence metadata in one explicit application
      description: Returns newest unexpired captures first, without body text or a pagination cursor.
        The optional request_id selects one capture and returns an empty items list if absent or expired.
        Empty results do not prove that a call was safe or never occurred. This is retained-capture scope,
        not the ordinary recent-call window. Query strings are limited to 512 bytes; repeated, empty and
        unsupported parameters are rejected. Authentication uses the administrator session, not an application key.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/EvidenceApplication'
      - $ref: '#/components/parameters/EvidenceLimit'
      - name: request_id
        in: query
        schema:
          $ref: '../schemas/evidence.schema.json#/$defs/RequestID'
      responses:
        '200':
          description: Bounded metadata list; history_may_be_missing is always true
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/EvidenceList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/evidence/access:
    get:
      summary: Read recent metadata-only evidence access events
      description: Returns newest events first from the retained 128-event memory window. The private
        journal is authenticated and capped at 8 MiB; no automatic rollover is implemented. Events describe
        authorization to change configuration, reveal content or delete expired files, not completion or
        client receipt. Actors distinguish sessions of the single administrator identity. Only limit is accepted.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/EvidenceLimit'
      responses:
        '200':
          description: Verified recent access metadata without captured body text
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/EvidenceAccessList'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/evidence/purge:
    post:
      summary: Delete expired evidence captures
      description: Records deletion authorization before removing each expired sealed file. Returns the
        number removed on success. Expiry already denies direct access; purge also runs at startup and
        during an applicable capture. Does not delete unexpired records, ordinary call logs, archived
        report metadata, backups or previously revealed copies. Does not guarantee physical secure erasure.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: Number of expired files removed
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/EvidencePurgeResult'
        '503':
          description: evidence_unavailable; authorization recording or deletion failed
        '507':
          description: evidence_capacity; no access-journal space to authorize deletion
        default:
          $ref: '#/components/responses/Error'
  /api/v1/evidence/{id}:
    get:
      summary: Inspect an authenticated evidence bundle without revealing body content
      description: Returns the retained call record, object metadata, available policy snapshots and
        findings projected from existing control observations. Trace is optional. Findings are not new
        detector runs, calibrated risk probabilities or legal conclusions. A released_output object is
        prepared client output; even write_completed does not prove remote receipt. Expired captures are
        inaccessible before physical purge. SSE objects may include sse-evidence-v1 metadata for validated
        upstream frames or downstream write-attempted frames, with at most 128 manifest entries and explicit
        end state. Stream bytes/fingerprints cover complete accepted stage frames, not all transport bytes;
        a retained incomplete stream is not a successful completion. Only application_id is accepted in the query.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/EvidencePathID'
      - $ref: '#/components/parameters/EvidenceApplication'
      responses:
        '200':
          description: Authenticated retained metadata and recorded findings
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/EvidenceDetail'
        '404':
          description: evidence_not_found; no capture exists in the selected application
        '410':
          description: evidence_expired; retention ended
        '503':
          description: evidence_unavailable; retained ciphertext or metadata could not be verified
        default:
          $ref: '#/components/responses/Error'
  /api/v1/evidence/{id}/graph:
    get:
      summary: Read metadata relationships for up to 32 retained captures
      description: Always restricted to the root application's scope. If the root has a trace ID,
        includes related retained captures with that trace, bounded to 32 total. Links connect calls,
        objects, snapshots and recorded findings. Parent/link/retry relationships remain caller_declared;
        matching targets do not prove causality. Missing and duplicate targets are unresolved or ambiguous.
        Fingerprints do not create inferred content-transfer edges. No body text is returned.
        history_may_be_missing remains true and graph_complete remains false. Only application_id is accepted.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/EvidencePathID'
      - $ref: '#/components/parameters/EvidenceApplication'
      responses:
        '200':
          description: Partial retained-evidence graph with explicit truncation and unavailable-record counts
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/EvidenceGraph'
        '404':
          description: evidence_not_found; root capture is absent from the selected application
        '410':
          description: evidence_expired; root capture retention ended
        default:
          $ref: '#/components/responses/Error'
  /api/v1/evidence/{id}/reveal:
    post:
      summary: Explicitly reveal a retained object's raw or pattern-limited content
      description: Requires administrator authentication, the selected application/object, a raw or redacted
        view and incident_review or validation as the reason. Both views record reveal_authorized durably
        before returning text; an unavailable/full access journal prevents disclosure. The redacted view
        uses finite sensitive-text-v3 patterns, not anonymization. Incomplete scans (including content
        beyond its 8 KiB scan limit) and credential matches withhold the whole object; other supported
        spans are replaced. Unrecognized personal data may remain and preview text need not be valid JSON.
        The response is untrusted sensitive data. No additional model call or detector-based policy action
        is performed. Authorization does not prove the client received the content.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/EvidencePathID'
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/evidence.schema.json#/$defs/EvidenceRevealRequest'
      responses:
        '200':
          description: Explicit raw text or finite-pattern preview, possibly entirely withheld
          content:
            application/json:
              schema:
                $ref: '../schemas/evidence.schema.json#/$defs/EvidenceContent'
        '404':
          description: evidence_not_found; no capture exists in the selected application
        '409':
          description: evidence_content_unavailable; this object has no retained text
        '410':
          description: evidence_expired; content access is denied
        '503':
          description: evidence_unavailable; stored evidence or the access journal cannot be verified or written
        '507':
          description: evidence_capacity; access journal has reached its bound
        default:
          $ref: '#/components/responses/Error'
  /v1/integration/check:
    get:
      summary: Check the supplied application's model configuration without contacting a provider
      description: Authenticates an application key and resolves its requested model grant. Returns only
        that application's identifier and advisory input/output policy applicability, audit admission
        availability and supported call mode. Does not contact an upstream, perform inference, reserve
        audit capacity or append a call record. This snapshot does not guarantee provider reachability,
        inference success, detector effectiveness or authorization of a later request. Administrator
        sessions are not accepted. The console compares application_id before an explicitly requested
        synthetic inference through the normal Chat Completions endpoint.
      security:
      - applicationKey: []
      parameters:
      - name: model
        in: query
        required: true
        description: One enabled model alias granted to this application. No other query parameters are accepted.
        schema:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9._/-]{0,99}$'
      responses:
        '200':
          description: Application configuration snapshot; inference remains not_tested even when audit is available
          content:
            application/json:
              schema:
                $ref: '../schemas/integration.schema.json#/$defs/IntegrationCheckView'
        '400':
          description: Missing, repeated, malformed or unsupported query parameters (invalid_integration_query)
        '401':
          description: Missing, invalid, repeated or revoked application authorization
        '403':
          description: Model access denied or the connection is disabled
        '503':
          description: Configured upstream credential could not be decrypted; no upstream was contacted
        default:
          $ref: '#/components/responses/Error'
  /healthz:
    get:
      summary: Process liveness (not model readiness)
      responses:
        '200':
          description: Service is running
  /api/v1/auth/status:
    get:
      summary: Read setup and current session status (no credentials in response)
      responses:
        '200':
          description: Authentication status
          content:
            application/json:
              schema:
                type: object
                required:
                - setup_required
                - setup_allowed
                - authenticated
                properties:
                  setup_required:
                    type: boolean
                  setup_allowed:
                    type: boolean
                  authenticated:
                    type: boolean
  /api/v1/auth/setup:
    post:
      summary: Set the first administrator password once and create a session
      description: Initialize new instances before exposing them to other users. Legacy token installations
        require direct loopback access; see migration documentation.
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        $ref: '#/components/requestBodies/Password'
      responses:
        '200':
          $ref: '#/components/responses/LoggedIn'
        '409':
          description: Password already configured; use login
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      summary: Verify password and issue a fresh session cookie
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        $ref: '#/components/requestBodies/Password'
      responses:
        '200':
          $ref: '#/components/responses/LoggedIn'
        '401':
          description: Invalid password
        '429':
          description: Global limit of 10 password attempts per minute or another derivation is in progress;
            Retry-After is 60 seconds
        default:
          $ref: '#/components/responses/Error'
  /api/v1/auth/logout:
    post:
      summary: Revoke this session immediately and expire its cookie
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Logged out (also succeeds for an expired session)
        default:
          $ref: '#/components/responses/Error'
  /api/v1/instance:
    get:
      summary: Read effective configuration, field sources and endpoint capability status
      security:
      - adminSession: []
      responses:
        '200':
          description: Effective instance configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '401':
          description: Missing or expired administrator session
    put:
      summary: Validate and atomically persist settings with optimistic concurrency
      security:
      - adminSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/instance.schema.json
      responses:
        '200':
          description: Saved effective configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instance'
        '400':
          description: Invalid schema, name, URL or JSON
        '401':
          description: Missing or expired administrator session
        '403':
          description: Cross-origin write refused
        '409':
          description: Stale revision or deployment-managed field
        '413':
          description: Request exceeds 16 KiB
        '415':
          description: Expected application/json
        '500':
          description: Persistence failed; effective settings remain unchanged
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
  /v1/chat/completions:
    post:
      summary: Authorized OpenAI-compatible Chat Completions with bounded JSON or SSE responses
      description: 1 MiB request limit. Model must be a configured alias. Additional JSON parameters pass through;
        provider-specific semantics are not translated. No automatic inference retries. SSE failure after headers
        aborts the response stream and records failure; HTTP 200 alone does not imply completion. Enabled in-scope
        credential policies inspect JSON string tokens before upstream I/O. A blocked match returns HTTP 403
        with error.code policy_blocked, including for stream=true; no SSE stream starts. Audit unavailable
        returns 503 even for policy hits. An enabled in-scope sensitive-output policy rejects stream=true
        with 400 content_stream_unsupported before provider I/O. Its non-streaming path requires one complete
        assistant text choice with finish_reason stop, or one explicitly declared read_resource function proposal
        with finish_reason tool_calls and empty assistant content. The tools array must declare exactly this
        function with one required resource_id string and additionalProperties false. Other declarations or
        legacy function-call requests return 400 content_tools_unsupported before provider I/O. Tool arguments
        must decode to exactly one bounded resource ID; parallel calls and mixed text/action outputs are withheld.
        The provider call ID is replaced by a gateway correlation ID. Proposals are not execution grants;
        the application must use the authorized read-tool endpoint. Limits remain a 64 KiB provider
        envelope and at most 8192 UTF-8 content bytes. Only checked text and bounded canonical completion fields
        are returned; unchecked provider extensions are dropped. Matched block-mode output returns 403
        content_output_blocked; unknown, unsupported or oversized output returns 502 content_output_unavailable.
        Observe, block and redact all withhold invalid/unknown output. Redact replaces selected contact spans with
        a fixed marker; any selected credential replaces the whole output. The transformed text is rechecked
        with the pinned detector before release. Sensitive action arguments are blocked in redact mode with reason
        tool_arguments_not_redactable, never rewritten. Output audit metadata identifies read-tool-call-v1
        for structured proposals. Terminal audit is saved before protected text or proposal release.
      security:
      - applicationKey: []
      parameters:
      - $ref: '#/components/parameters/TraceID'
      - $ref: '#/components/parameters/ParentSpanID'
      - $ref: '#/components/parameters/AgentID'
      - $ref: '#/components/parameters/SpanLinks'
      - $ref: '#/components/parameters/RetryOf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  maxLength: 100
                messages:
                  type: array
                  minItems: 1
                  items:
                    type: object
                stream:
                  type: boolean
                  default: false
              required:
              - model
              - messages
      responses:
        '200':
          description: Valid JSON completion or SSE events terminated by [DONE]
          headers:
            X-GovWeave-Trace-ID:
              description: Present for valid opt-in tracing; correlation alone does not guarantee audit commit.
              schema: {type: string, pattern: '^[0-9a-f]{32}$'}
            X-GovWeave-Span-ID:
              description: New gateway-generated span for this request, including rejected traced calls.
              schema: {type: string, pattern: '^[0-9a-f]{16}$'}
            X-GovWeave-Output-Action:
              schema: {const: redacted}
              description: Present only after successful protected text redaction and durable audit.
            X-Request-ID:
              schema: &id003
                type: string
              description: Gateway-generated request ID for call record correlation
          content:
            application/json:
              schema:
                type: object
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/Error'
  /mcp:
    post:
      summary: Reserved MCP endpoint; not implemented
      responses:
        '501':
          description: MCP gateway is not implemented
  /api/v1/gateway:
    get:
      summary: Read connections and applications; no credentials, ciphertext or key hashes
      security:
      - adminSession: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewaySnapshot'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/connections:
    post:
      summary: Create connection
      security:
      - adminSession: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema: &id001
              $ref: ../schemas/gateway.schema.json#/$defs/connection
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
  /api/v1/connections/{id}:
    put:
      summary: Update connection using its current revision
      security:
      - adminSession: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema: *id001
      parameters:
      - $ref: '#/components/parameters/RecordID'
      - $ref: '#/components/parameters/ConsoleRequest'
  /api/v1/applications:
    post:
      summary: Create application
      security:
      - adminSession: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationResult'
        default:
          $ref: '#/components/responses/Error'
