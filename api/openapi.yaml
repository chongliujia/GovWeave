  /api/v1/compliance/products/{id}/test-plans:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: List independent model and read-tool plans for a product
      description: At most one plan per target kind, including the original default plan.
        An omitted plan_id identifies that legacy default. Listing performs no provider I/O.
      security:
      - adminSession: []
      responses:
        '200':
          description: Up to two plans with their independent revisions, schedules and recent run IDs.
          content:
            application/json:
              schema:
                $ref: '../schemas/testing.schema.json#/$defs/Plans'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/products/{id}/test-plans/{plan}:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    - {name: plan, in: path, required: true, schema: {type: string, enum: [model, read_tool]}}
    get:
      summary: Read a named test plan
      security:
      - adminSession: []
      responses:
        '200':
          description: Exact named plan; does not fall back to the legacy default.
          content:
            application/json:
              schema:
                $ref: '../schemas/testing.schema.json#/$defs/Plan'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Save a named model or read-tool test plan
      description: The URL selects the plan ID; do not include plan_id in the body.
        Use revision zero for creation and the returned revision for updates. The model plan requires
        a model suite and model fields; read_tool requires target_kind read_tool, a tool suite and tool fields.
        There may be only one plan per target kind, counting any legacy default. Schedule opt-in and
        execution limits are the same as the default plan. Saving does not invoke a provider; it invalidates
        only this plan's test evidence. Shared configuration changes still invalidate both targets.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/testing.schema.json#/$defs/PlanInput'
      responses:
        '200':
          description: Saved named plan with an independent revision and scheduling state.
          content:
            application/json:
              schema:
                $ref: '../schemas/testing.schema.json#/$defs/Plan'
        '409':
          description: revision_conflict or test_plan_target_conflict; update the existing plan of that target kind.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/products/{id}/test-plan:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: Read the legacy default test plan and scheduling errors
      security:
      - adminSession: []
      responses:
        '200':
          description: Persisted plan; last_run_id points to case outcomes.
          content:
            application/json:
              schema:
                $ref: '../schemas/testing.schema.json#/$defs/Plan'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Save the legacy default test plan
      description: Explicit schedule_enabled authorizes recurring requests to the configured model or read tool.
        Read-tool plans use target_kind read_tool and tool_alias, without model_alias or max_output_tokens;
        the suite must match the target kind. First due after one interval;
        300–2592000 seconds. Retain responses only with explicit retain_responses. Output-control checks
        never retain returned text even with that option. Plan changes invalidate current test-backed
        product evidence for this plan. Initial revision is zero. Existing default serialization is preserved.
        A second plan of the same target kind is rejected, including conflicts with named plans.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/testing.schema.json#/$defs/PlanInput'
      responses:
        '200':
          description: Saved plan; saving does not immediately call the target.
          content:
            application/json:
              schema:
                $ref: '../schemas/testing.schema.json#/$defs/Plan'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/products/{id}/test-runs:
    parameters:
    - {name: id, in: path, required: true, schema: {type: string}}
    get:
      summary: List historical active test runs
      security:
      - adminSession: []
      responses:
        '200':
          description: Newest first; historical statuses are not current deployment approvals.
          content:
            application/json:
              schema:
                $ref: '../schemas/testing.schema.json#/$defs/Runs'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Start a bounded pre-deployment or operation test run
      description: Uses an administrator-authorized application bound to the product through normal gateway
        grants, credential policy and durable audit admission. Two runs globally, one per product, 16
        sequential cases per plan. plan_id selects model or read_tool; omission or empty selects only the
        legacy default. A missing default returns 404 without selecting another plan or executing I/O. No fan-out.
        Five minutes total. Supports versioned synthetic-canary detection with fresh per-case markers. No automatic inference retry. Responses are retained only
        when opted in, except receipt-based output and tool-denial checks which never retain returned text.
        Read-tool runs use ordinary resource grants and durable audit, with no model grant required.
        All resources must be known; output probes must be granted. A denial probe whose grant expanded
        may reach the provider and fails authorization verification, so use synthetic resources.
        Rule evaluation for this plan is saved in the test run; it does not import the other plan's facts.
        Qualifying current output-control phase facts from both plans enter product evaluation under
        separate model and tool namespaces. Scheduling remains independent but shares the per-product limit.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phase]
              properties:
                phase: {type: string, enum: [pre_deployment, operation]}
                plan_id: {type: string, enum: ['', model, read_tool], description: Omit or use empty for the legacy default; named plans require explicit selection.}
      responses:
        '202':
          description: Evidence space reserved; poll test-runs/{id} for completion.
          content:
            application/json:
              schema:
                $ref: '../schemas/testing.schema.json#/$defs/Summary'
        '429':
          description: test_busy; overlapping product run or global concurrency reached.
        '409':
          description: test_capacity or revision/source conflict; no new target request.
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/test-runs/{run}:
    parameters:
    - {name: run, in: path, required: true, schema: {type: string}}
    get:
      summary: Read private test evidence and deterministic rule evaluation
      security:
      - adminSession: []
      responses:
        '200':
          description: Saved versions, test set, product facts, case outcomes and optional response text.
            Provider errors stay unknown. Canary results include detector version, generated synthetic marker and bounded evidence spans; absence is not a general privacy guarantee. Passing tests do not establish legal or whole-framework compliance.
          content:
            application/json:
              schema:
                $ref: '../schemas/testing.schema.json#/$defs/Run'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/compliance/test-runs/{run}/replay:
    parameters:
    - {name: run, in: path, required: true, schema: {type: string}}
    post:
      summary: Replay saved rule decisions without requesting the model
      description: Uses the retained facts, rule pack and time. Does not revalidate remote output or detector
        conclusions from hashes. Test runner versions other than the supported version are rejected on load.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false}
      responses:
        '200':
          description: Retained deterministic evaluation and comparison result.
          content:
            application/json:
              schema:
                $ref: '../schemas/testing.schema.json#/$defs/Replay'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/tools:
    get:
      summary: Read current controlled read-tool configuration and global revision
      security:
      - adminSession: []
      responses:
        '200':
          description: Tool metadata without credentials or ciphertext
          content:
            application/json:
              schema:
                $ref: '../schemas/tools.schema.json#/$defs/ToolSnapshot'
        default:
          $ref: '#/components/responses/Error'
    post:
      summary: Create an application-scoped read tool and immutable configuration snapshot
      description: Requires the current global tool-store revision. Maximum 32 tools, 128 total retained
        revisions, 32 resources per tool and 32 application grants per resource. Empty resource grants deny all.
        The fixed provider endpoint accepts POST with a resource_id and returns exactly one text field.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/tools.schema.json#/$defs/ToolInput'
      responses:
        '201':
          description: Created tool metadata without upstream credential
          content:
            application/json:
              schema:
                $ref: '../schemas/tools.schema.json#/$defs/Tool'
        '409':
          description: Stale global revision or tool history capacity reached
        default:
          $ref: '#/components/responses/Error'
  /api/v1/tools/{id}:
    put:
      summary: Replace tool configuration and append an immutable snapshot
      description: revision is the global revision from GET /api/v1/tools, not the tool's own revision.
        Omit or null api_key to retain the credential; an empty string clears it. Set enabled to false to disable.
        Already admitted calls use their accepted snapshot. There is no deletion or pruning endpoint.
      security:
      - adminSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
        description: Tool ID from the administrative snapshot
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/tools.schema.json#/$defs/ToolInput'
      responses:
        '200':
          description: Saved immutable tool snapshot
          content:
            application/json:
              schema:
                $ref: '../schemas/tools.schema.json#/$defs/Tool'
        '409':
          description: Stale global revision or tool history capacity reached
        default:
          $ref: '#/components/responses/Error'
  /api/v1/tools/{id}/history:
    get:
      summary: Read retained immutable tool metadata, newest revision first
      description: Resolve tool_governance.tool_revision and snapshot_sha256 from a tools.invoke or assessment.tools.invoke call record.
        Credentials and ciphertext are never included. Snapshot hashes are consistency checks, not signatures.
      security:
      - adminSession: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Retained tool history
          content:
            application/json:
              schema:
                $ref: '../schemas/tools.schema.json#/$defs/ToolHistory'
        default:
          $ref: '#/components/responses/Error'
  /v1/tools/{alias}/invoke:
    post:
      summary: Authorize and execute a configured read tool, then check its output before release
      description: Application key required. Request is at most 4 KiB and contains only resource_id;
        caller-supplied identity, permissions and URLs are rejected. Unknown/disabled tools or unauthorized
        resources return the same tool_not_allowed error before provider I/O. The configured provider must
        return HTTP 200 JSON with exactly one text string, at most 8192 UTF-8 bytes within a 64 KiB envelope.
        Fixed credentials-v1 patterns run on returned text; block mode withholds matches, while observe
        mode releases text with a finding. Protocol, timeout, size and audit failures withhold output in both
        modes. Terminal audit is persisted before releasing text. No redirects, automatic POST retries,
        output streaming, end-user delegation, write tools, MCP execution or general semantic safety verdict.
        An enabled in-scope sensitive-output policy adds credential/email/phone-category checks on the
        returned text. Optional instruction_policy (tool-instructions-v1 or tool-instructions-v2, observe or block) checks
        explicit task overrides, authority spoofing and role delimiters before text is released; quoted
        attack examples also match. A match in block mode returns 403 tool_instruction_blocked; an
        incomplete instruction check returns 502 tool_instruction_unavailable. Exact operator-declared
        resource instruction_review settings can exempt named instruction rules only for the matching detector
        generation and SHA-256 of the decoded text bytes. Changed documents receive no exceptions; unchanged
        documents keep any unreviewed rule actions. Authorization, credential checks, sensitive-output protection
        and durable audit remain independent. V2 adds a bounded answer_manipulation syntax signal for selected
        English/Chinese answer-directed commands, including legitimate or quoted commands. Review evidence records
        matched/mismatch/unavailable plus exempted rule IDs without a runtime document hash. Exact operator-declared
        public_emails in the sensitive-output policy can exempt literal email findings within its
        application scope; other addresses and credentials keep their protection. The sensitive-output
        assessment is exposed as governance.output_policy and in audit metadata. The legacy tool credential
        block takes precedence over either additional policy.
        Either policy can withhold output; enabling the new policy does not disable the legacy control.
        Redact mode replaces selected findings, rechecks the transformed text and reports completed evidence
        with decision redact and output_policy.result redacted. Any selected credential replaces the entire text.
      security:
      - applicationKey: []
      parameters:
      - $ref: '#/components/parameters/TraceID'
      - $ref: '#/components/parameters/ParentSpanID'
      - $ref: '#/components/parameters/AgentID'
      - $ref: '#/components/parameters/SpanLinks'
      - $ref: '#/components/parameters/RetryOf'
      - name: alias
        in: path
        required: true
        schema:
          $ref: '../schemas/tools.schema.json#/$defs/Identifier'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/tools.schema.json#/$defs/InvokeRequest'
      responses:
        '200':
          description: Checked text and terminal allow/observe/redact decision
          headers:
            X-GovWeave-Trace-ID:
              description: Present for valid opt-in tracing; correlation alone does not guarantee audit commit.
              schema: {type: string, pattern: '^[0-9a-f]{32}$'}
            X-GovWeave-Span-ID:
              description: New gateway-generated span for this request, including rejected traced calls.
              schema: {type: string, pattern: '^[0-9a-f]{16}$'}
            X-GovWeave-Output-Action:
              schema: {const: redacted}
              description: Present only for completed redaction after durable audit.
            X-Request-ID:
              description: Correlates the decision with the metadata-only request record
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../schemas/tools.schema.json#/$defs/InvokeResponse'
        default:
          description: No provider text. Errors use 400/401/403/413/415/429/499/502/503/504;
            tool_not_allowed means no provider call, while tool_output_blocked means the provider was called
            but its output was withheld. Request-ID generation failure uses the base error envelope.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '../schemas/tools.schema.json#/$defs/InvokeError'
                - $ref: '#/components/schemas/Error'
  /v1/content/evaluations:
    post:
      summary: Observe bounded sensitive-text candidates and evaluate the application's output policy
      description: Uses an application Bearer key. The strict body contains only text, at most 8192 UTF-8
        bytes within a 64 KiB JSON envelope. Always runs the policy-pinned detector generation for all supported categories,
        even when output enforcement is disabled. Returns category/rule identifiers and byte offsets without
        echoing text; no model or tool is called. HTTP 200 means evaluation completed, not that content is safe
        or allowed; inspect detection.state and policy.result. Unknown observations remain unknown. Audit records
        contain policy metadata only, without text, matched values, hashes or spans. No automatic redaction or
        legal compliance determination.
      security:
      - applicationKey: []
      parameters:
      - $ref: '#/components/parameters/TraceID'
      - $ref: '#/components/parameters/ParentSpanID'
      - $ref: '#/components/parameters/AgentID'
      - $ref: '#/components/parameters/SpanLinks'
      - $ref: '#/components/parameters/RetryOf'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/content.schema.json#/$defs/ContentEvaluationRequest'
      responses:
        '200':
          description: Detector observations and policy result; no submitted text
          headers:
            X-GovWeave-Trace-ID:
              description: Present for valid opt-in tracing; correlation alone does not guarantee audit commit.
              schema: {type: string, pattern: '^[0-9a-f]{32}$'}
            X-GovWeave-Span-ID:
              description: New gateway-generated span for this request, including rejected traced calls.
              schema: {type: string, pattern: '^[0-9a-f]{16}$'}
            X-Request-ID:
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: '../schemas/content.schema.json#/$defs/ContentEvaluationResponse'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/policies/sensitive-output:
    get:
      summary: Read the current sensitive-output policy
      security:
      - adminSession: []
      responses:
        '200':
          description: Current policy; initial revision zero is disabled
          content:
            application/json:
              schema:
                $ref: '../schemas/content.schema.json#/$defs/OutputPolicySnapshot'
        default:
          $ref: '#/components/responses/Error'
    put:
      summary: Save and retain an immutable sensitive-output policy revision
      description: Applies to configured model and read-tool output for selected applications. Empty application
        scope means all applications. Categories select credential, email and/or phone findings for decision;
        matches are candidate observations, not proof of personal ownership or a legal violation. Observe releases
        matched valid output, block withholds it, and redact replaces selected contact spans or the entire text on a
        selected credential match. Redact snapshots pin redaction_version sensitive-redaction-v1. All active modes
        withhold unknown/unsupported output. Active scoped model
        policies reject streaming before provider I/O. Optional detector_version selects sensitive-text-v1, sensitive-text-v2 or sensitive-text-v3;
        omission preserves the current generation (initially v1). V2 adds bounded width/zero-width normalization and
        bracketed email separators with original byte offsets. Changes affect later admitted calls. Stores at most 128
        snapshots. Optional public_emails declares up to 16 exact ASCII public email addresses for this application
        scope. Literal matches are exempted from email actions in final model text, tool output and standalone
        evaluation; raw detection stays observed. No domain wildcard, normalization, credential exemption or
        unknown-scan exemption. Omission/null/empty clears the list on PUT. All history must fit
        within 2 MiB including revision zero; exhaustion returns output_history_full without evicting history.
      security:
      - adminSession: []
      parameters:
      - $ref: '#/components/parameters/ConsoleRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../schemas/content.schema.json#/$defs/OutputPolicyInput'
      responses:
        '200':
          description: Newly active immutable revision
          content:
            application/json:
              schema:
                $ref: '../schemas/content.schema.json#/$defs/OutputPolicySnapshot'
        '409':
          description: revision_conflict or output_history_full; previous policy stays active
        default:
          $ref: '#/components/responses/Error'
  /api/v1/policies/sensitive-output/history:
    get:
      summary: Read retained sensitive-output policy snapshots, newest first
      security:
      - adminSession: []
      responses:
        '200':
          description: Bounded complete history including initial revision zero
          content:
            application/json:
              schema:
                $ref: '../schemas/content.schema.json#/$defs/OutputPolicyHistory'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/policies/sensitive-output/revisions/{revision}:
    get:
      summary: Read one immutable sensitive-output policy revision
      security:
      - adminSession: []
      parameters:
      - name: revision
        in: path
        required: true
        schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: Exact saved revision
          content:
            application/json:
              schema:
                $ref: '../schemas/content.schema.json#/$defs/OutputPolicySnapshot'
        '404':
          description: Revision does not exist
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: govweave_session
      description: HttpOnly session established by password setup or login; expires after 8 hours, logout or
        restart.
    applicationKey:
      type: http
      scheme: bearer
      description: Application key returned only on creation or rotation; never use an administrator password
        or session here.
  schemas:
    Instance:
      type: object
      required:
      - schema_version
      - revision
      - organization_name
      - public_url
      - configured
      - sources
      - listen_addr
      - endpoints
      properties:
        schema_version:
          const: 1
        revision:
          type: integer
          minimum: 0
        organization_name:
          type: string
        public_url:
          type: string
        updated_at:
          type: string
          format: date-time
        configured:
          type: boolean
          description: Organization name and public URL are set; not model readiness
        listen_addr:
          type: string
        sources:
          type: object
          additionalProperties:
            enum:
            - unconfigured
            - console
            - file
            - environment
        endpoints:
          type: object
          additionalProperties:
            type: object
            required:
            - url
            - status
            properties:
              url:
                type: string
              status:
                enum:
                - available
                - planned
    Connection:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        base_url:
          type: string
        model:
          type: string
        alias:
          type: string
        created_at:
          type: string
        revision: &id006
          type: integer
          minimum: 0
        enabled: &id005
          type: boolean
        allow_insecure_http: *id005
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 300
        has_credential: *id005
      required:
      - id
      - name
      - base_url
      - model
      - alias
      - created_at
      - revision
      - enabled
      - allow_insecure_http
      - timeout_seconds
      - has_credential
    Application:
      type: object
      properties:
        id: *id003
        revision: *id006
        name: *id003
        allowed_connections:
          type: array
          minItems: 0
          maxItems: 256
          description: Explicit model-connection grants. Empty grants no model access and supports tool-only applications.
          items: *id003
        key_prefix: *id003
        revoked: *id005
        created_at: *id003
      required:
      - id
      - revision
      - name
      - allowed_connections
      - key_prefix
      - revoked
      - created_at
    ApplicationResult:
      type: object
      properties:
        application:
          $ref: '#/components/schemas/Application'
        api_key:
          type: string
          description: One-time plaintext application key, present only for creation or rotation. Never appears
            in a later snapshot.
      required:
      - application
    GatewaySnapshot:
      type: object
      properties:
        revision: *id006
        connections:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
        applications:
          type: array
          items:
            $ref: '#/components/schemas/Application'
      required:
      - revision
      - connections
      - applications
    ProbeResult:
      type: object
      properties:
        ok: *id005
        model_found: *id005
        http_status: *id006
        duration_ms: *id006
        message: *id003
        request_id: *id003
      required:
      - ok
      - model_found
      - http_status
      - duration_ms
      - message
      - request_id
    CallRecord:
      type: object
      properties:
        trace:
          $ref: '../schemas/traces.schema.json#/$defs/TraceContext'
          description: Optional opt-in association. App identity and execution are gateway evidence; relationships are caller claims.
        request_id:
          type: string
        started_at:
          type: string
        timestamp:
          type: string
        operation:
          type: string
          description: Includes assessment.chat.completions and assessment.tools.invoke for active tests,
            excluded from production counters but retained in the shared bounded audit index.
        application_id:
          type: string
        connection_id:
          type: string
        model:
          type: string
        error_code:
          type: string
        schema_version:
          const: 1
        phase:
          enum:
          - started
          - finished
        policy_revision:
          type: integer
          minimum: 0
          description: 'Legacy field: global connection/application configuration revision. Credential policy
            version is content_policy.revision.'
        decision:
          enum:
          - allow
          - deny
          - not_evaluated
          - evaluated
        outcome:
          enum:
          - in_progress
          - completed
          - blocked
          - rejected
          - failed
          - cancelled
          - incomplete
        http_status: *id006
        upstream_status: *id006
        upstream_attempted: *id005
        streaming: *id005
        duration_ms: *id006
        first_byte_ms: *id006
        content_policy:
          $ref: '#/components/schemas/PolicyAssessment'
          description: Optional for backward compatibility. Present only after request credential policy evaluation;
            separate from access authorization.
        tool_governance:
          $ref: '../schemas/tools.schema.json#/$defs/Governance'
          description: Present for tools.invoke and assessment.tools.invoke. Fixed authorization, sensitivity and content evidence;
            no resource IDs or content. The tool revision/hash resolves through the tool history API.
        output_policy:
          $ref: '../schemas/content.schema.json#/$defs/OutputAssessment'
          description: Optional sensitive-output assessment for model, tool or standalone content evaluation;
            fixed identifiers and category decisions only, without text, offsets or content hashes.
      required:
      - request_id
      - started_at
      - timestamp
      - operation
      - schema_version
      - phase
      - policy_revision
      - decision
      - outcome
      - http_status
      - upstream_attempted
      - streaming
      - duration_ms
    AuditView:
      type: object
      properties:
        available: *id005
        bytes: *id006
        max_bytes: *id006
        records:
          type: array
          items:
            $ref: '#/components/schemas/CallRecord'
      required:
      - available
      - bytes
      - max_bytes
      - records
    Revision:
      type: object
      properties:
        revision:
          type: integer
          minimum: 1
      required:
      - revision
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: *id003
            message: *id003
          required:
          - code
          - message
        request_id: *id003
      required:
      - error
    CredentialPolicyInput:
      type: object
      additionalProperties: false
      required:
      - revision
      - mode
      - rules
      - application_ids
      - connection_ids
      properties:
        revision: &id008
          type: integer
          minimum: 0
        mode: &id009
          enum:
          - disabled
          - observe
          - block
        rules: &id010
          type: array
          minItems: 1
          maxItems: 2
          uniqueItems: true
          items:
            enum:
            - private_key
            - api_key
        application_ids: &id007
          type: array
          maxItems: 64
          uniqueItems: true
          items:
            type: string
          description: Empty means all, including future items. Non-empty IDs must exist; application and connection
            scopes are ANDed.
        connection_ids: *id007
    CredentialPolicy:
      type: object
      required:
      - revision
      - mode
      - rules
      - application_ids
      - connection_ids
      - schema_version
      - id
      - ruleset_version
      properties:
        revision: *id008
        mode: *id009
        rules: *id010
        application_ids: *id007
        connection_ids: *id007
        schema_version:
          const: 1
        id:
          const: credential-egress
        ruleset_version:
          const: credentials-v1
        updated_at:
          type: string
          format: date-time
    CredentialPolicyHistory:
      type: object
      additionalProperties: false
      required:
      - snapshots
      - total
      properties:
        snapshots:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/CredentialPolicy'
        total:
          type: integer
          minimum: 1
          maximum: 1024
          description: Total retained snapshots, including ones outside this page.
        next_before_revision:
          type: integer
          minimum: 1
          description: Exclusive before_revision cursor; omitted when no older page remains.
    PolicyAssessment:
      type: object
      additionalProperties: false
      required:
      - id
      - revision
      - ruleset_version
      - mode
      - result
      - matched_rules
      - check_duration_us
      properties:
        id:
          const: credential-egress
        revision:
          type: integer
          minimum: 0
        ruleset_version:
          type: string
        mode: *id009
        result:
          enum:
          - disabled
          - not_applicable
          - allow
          - observe
          - block
          - error
        matched_rules:
          type: array
          maxItems: 2
          items:
            enum:
            - private_key
            - api_key
          description: Fixed rule IDs only; no matched text, positions or hashes of secrets.
        check_duration_us:
          type: integer
          minimum: 0
  requestBodies:
    Password:
      required: true
      content:
        application/json:
          schema:
            type: object
            required:
            - password
            additionalProperties: false
            properties:
              password:
                type: string
                minLength: 12
                maxLength: 128
                writeOnly: true
  parameters:
    TaskSnapshotPathID:
      name: snapshot_id
      in: path
      required: true
      schema:
        $ref: '../schemas/evidence.schema.json#/$defs/TaskSnapshotID'
    TaskSnapshotApplications:
      name: application_id
      in: query
      required: true
      style: form
      explode: true
      description: Explicit existing applications. For saved snapshots this set must match exactly;
        repeated parameters must carry distinct values. Application keys cannot access these routes.
      schema:
        type: array
        minItems: 1
        maxItems: 16
        uniqueItems: true
        items:
          $ref: '../schemas/evidence.schema.json#/$defs/ApplicationID'
    EvidencePathID:
      name: id
      in: path
      required: true
      schema:
        $ref: '../schemas/evidence.schema.json#/$defs/EvidenceID'
    EvidenceApplication:
      name: application_id
      in: query
      required: true
      description: One explicitly selected existing application. A matching evidence ID or trace does not grant access across applications.
      schema:
        $ref: '../schemas/evidence.schema.json#/$defs/ApplicationID'
    EvidenceLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    TracePathID:
      name: trace_id
      in: path
      required: true
      schema: {type: string, pattern: '^(?!0{32}$)[0-9a-f]{32}$'}
    TraceLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 128, default: 100}
    TraceID:
      name: X-GovWeave-Trace-ID
      in: header
      description: Optional application-scoped correlation. Required with any other tracing header.
        These are custom GovWeave headers, not a complete W3C Trace Context implementation.
        Malformed or repeated headers return 400 invalid_trace_context before upstream I/O.
        They are never forwarded to the provider. X-GovWeave-Span-ID is server-owned and forbidden on requests.
      schema: {type: string, pattern: '^(?!0{32}$)[0-9a-f]{32}$'}
    ParentSpanID:
      name: X-GovWeave-Parent-Span-ID
      in: header
      description: Caller-declared primary predecessor, not proof of causality or permission.
      schema: {type: string, pattern: '^(?!0{16}$)[0-9a-f]{16}$'}
    AgentID:
      name: X-GovWeave-Agent-ID
      in: header
      description: Opaque caller-declared agent identity; the authenticated application remains authoritative.
      schema: {type: string, pattern: '^(?!0{16}$)[0-9a-f]{16}$'}
    SpanLinks:
      name: X-GovWeave-Link-Span-IDs
      in: header
      description: One to four distinct, nonzero 16-character lowercase hex IDs, comma separated without whitespace.
        Declares dependencies for parallel joins; only visible returned spans can resolve them.
      schema: {type: string, maxLength: 67, pattern: '^[0-9a-f]{16}(,[0-9a-f]{16}){0,3}$'}
    RetryOf:
      name: X-GovWeave-Retry-Of
      in: header
      description: Declares an earlier attempt. Does not request replay, deduplication or an automatic retry.
      schema: {type: string, pattern: '^(?!0{16}$)[0-9a-f]{16}$'}
    ConsoleRequest:
      name: X-GovWeave-Request
      in: header
      required: true
      schema:
        type: string
        const: console
    RecordID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Connection or application ID from the administrative snapshot.
  responses:
    LoggedIn:
      description: Session created; JSON contains only authentication state, never credentials
      headers:
        Set-Cookie:
          description: govweave_session; Path=/api/; HttpOnly; SameSite=Strict; Max-Age=28800; Secure when
            using HTTPS
          schema:
            type: string
      content:
        application/json:
          schema:
            type: object
            required:
            - authenticated
            - setup_required
            properties:
              authenticated:
                const: true
              setup_required:
                const: false
    Error:
      description: Structured error. Management APIs use 400/401/403/404/409/410/413/415/429/500/503/507; model APIs
        additionally use 422/499/502/504. Error details from providers are not returned.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
